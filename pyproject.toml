[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hmrec"
version = "0.1.0"
description = "H&M personalized fashion recommendation: 6-channel recall + LightGBM LambdaMART ranker."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "implicit>=0.7.2",
    "lightgbm>=4.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "threadpoolctl==3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1.380",
]
# The recommendation service of M14 (docs/mlops.md §9). Its image installs ONLY this
# group (Dockerfile.serving: `uv sync --only-group serving`), so numpy is named here
# too: the service needs nothing else of the project's dependencies.
# The development environment and the pipeline image install it NEXT TO the dev group,
# because the tests of the service run there: `make setup` and the Dockerfile call
# `uv sync --group serving`. It is not a default group on purpose: a plain `uv sync`
# installs the runtime and dev set only (tests/unit/test_versioning_rules.py).
serving = [
    "fastapi>=0.165.0",
    "numpy>=2.5.4",
    "uvicorn>=0.54.0",
]
tracking = [
    "mlflow>=3.18.0",
]
versioning = [
    "dvc[gs]>=3.67.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hmrec"]

# ---------------------------------------------------------------- uv
# torch on Linux comes from the PyTorch CPU-only index (docs/mlops.md §8.1, decision D6).
# Why: the default PyPI wheel for Linux pulls several GB of CUDA libraries that this
# project never uses (AGENTS.md §4: no CUDA). macOS keeps the PyPI wheel, so the laptop
# environment is unchanged.
# `explicit = true`: this index is used ONLY for the packages named in [tool.uv.sources];
# every other package still comes from PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "D",   # docstrings (AGENTS.md §6.2)
    "T20", # no print (AGENTS.md §3.4)
    "PTH", # use pathlib
    "NPY", # numpy-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are self-describing by name; docstrings are optional there.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
