# CI of stage 3 (docs/mlops.md §11): on every push and pull request, build the x86-64
# container image and run lint and both test suites INSIDE it.
#
# Why inside the image: Cloud Run runs x86-64 Linux, the laptop is arm64 macOS. A problem
# that only shows on x86-64 Linux is found here, long before the cloud milestone.
#
# The image is NOT pushed to any registry, and this workflow uses no secret.
# Third-party actions are pinned by commit hash; the comment gives the release.

name: ci

on:
  push:
  pull_request:

# The token of this workflow may only read the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image, lint, tests (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image carries the commit it was built from (docs/mlops.md §8.1). A fresh checkout
      # is a clean, committed tree by construction. For a pull request the checkout is the
      # merge commit GitHub creates, and that is the hash recorded here.
      - name: Read the commit of the checkout
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # push: false  -> the image goes to no registry.
      # load: true   -> the image is loaded into the runner's Docker, so the steps below run it.
      # cache-*      -> layers are kept in the GitHub Actions cache; the dependency layer
      #                 (about 1.5 GB) is rebuilt only when uv.lock or the Dockerfile changes.
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hmrec:dev
          build-args: |
            GIT_COMMIT=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image information (commit, Python, libraries, OpenMP, BLAS, CPUs, memory)
        run: make image-info

      - name: Lint inside the image (ruff format, ruff check, pyright)
        run: make image-lint

      # torch and LightGBM never share a process (tests/conftest.py), so the suite runs as two
      # processes. They are two steps, and the second runs even if the first fails, so that
      # one run shows every failing test of both sides.
      - name: Tests inside the image, torch side
        if: ${{ !cancelled() }}
        run: make image-test-torch-side

      - name: Tests inside the image, LightGBM side
        if: ${{ !cancelled() }}
        run: make image-test-lightgbm-side
