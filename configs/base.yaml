# Global settings shared by every task. Read by hmrec.config.load_base_config.
# Relative paths are resolved against the repository root (the folder that holds configs/).

paths:
  data_root: data            # raw CSV in data/raw/, Parquet + embeddings in data/processed/
  artifacts_root: artifacts  # everything that can be regenerated (not in git)
  results_root: results      # small summary tables (in git)

seed: 42                     # global default seed; component configs may set their own

num_threads: 6               # CPU threads for Polars / LightGBM / implicit (AGENTS.md §4)

memory:
  limit_gb: 6.0              # peak memory budget for a single task (proposal §1.3)
  sample_interval_seconds: 0.5  # how often MemoryTracker samples process RSS

chunking:
  query_chunk_size: 10000    # queries per chunk for fusion / features / ranker scoring (proposal §1.3)
  item_chunk_size: 2000      # seed items per chunk for R4 ItemCF co-occurrence (proposal §1.3)
