# Global settings shared by every task. Read by hmrec.config.load_base_config.
# Relative paths are resolved against the repository root (the folder that holds configs/).

paths:
  data_root: data            # raw CSV in data/raw/, Parquet + embeddings in data/processed/
  artifacts_root: artifacts  # everything that can be regenerated (not in git)
  results_root: results      # small summary tables (in git)

seed: 42                     # global default seed; component configs may set their own

num_threads: 6               # CPU threads for Polars / LightGBM / implicit (AGENTS.md §4)

memory:
  # Upper limit of the TRUE peak RSS (ru_maxrss) of one process, in GB (proposal §1.3).
  # The machine has 8 GB, so 1 GB is left for the system. It was 6.0 until 2026-11-18:
  # the F1 feature build peaked at 6.10 GB and the limit was raised instead of changing
  # the build code (docs/decisions.md).
  limit_gb: 7.0
  sample_interval_seconds: 0.5  # how often MemoryTracker samples process RSS

chunking:
  query_chunk_size: 10000    # queries per chunk for fusion / features / ranker scoring (proposal §1.3)
  # Seed items per chunk for R4 ItemCF co-occurrence (proposal §1.3). 2000 in the D phase;
  # halved at M5, because the heaviest D-phase trial peaked at 4.76 GB, too close to the
  # 6 GB limit. It changes memory and speed only: chunked and unchunked C_w are
  # bit-identical (tests/unit/test_r4_itemcf.py).
  item_chunk_size: 1000
  dense_score_query_chunk_size: 5000  # queries per chunk when scoring all active articles with
                                      # vectors (R5; later R6): 5,000 x ~21k articles x 4 B = 0.4 GB
  # R6 only: queries per chunk of the user x active-article SCORE matrix. Smaller than
  # dense_score_query_chunk_size to halve the transient memory of scoring (score matrix +
  # np.partition copy: 2,500 x ~22k x 4 B x 2 = 0.4 GB instead of 0.9 GB). It changes memory
  # only: stored scores come from dot_pairs and user vectors are still encoded in chunks of
  # dense_score_query_chunk_size, exactly as in the recorded D-phase runs (decisions.md).
  twotower_score_query_chunk_size: 2500
  pair_chunk_size: 500000    # (customer, article) pairs per chunk for vector dot products
                             # (hmrec.vectors.dot_pairs; 500k x 64 dims x 4 B x 2 sides = 256 MB per chunk)
