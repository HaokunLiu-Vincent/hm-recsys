# M0 preprocessing settings (proposal §1.3, §2, §5 R1). Read by hmrec.config.load_preprocess_config.
#
# The processed data in data/processed/ is only valid for the values below.
# data/processed/metadata.json stores a hash of this config, and downstream code
# refuses to read processed data that was built with a different config.

# Day 0 of the integer day index `t_dat_day`: t_dat_day = (t_dat - day_zero).days.
# Must equal the first date in transactions_train.csv (checked during preprocessing).
day_zero: 2018-09-20

# Age buckets for R1 popularity (proposal §5 R1). FROZEN, not a hyperparameter.
# min_age and max_age are both INCLUSIVE. Buckets must be sorted and contiguous.
age_buckets:
  - {name: AGE_18_24, min_age: 18, max_age: 24}
  - {name: AGE_25_34, min_age: 25, max_age: 34}
  - {name: AGE_35_44, min_age: 35, max_age: 44}
  - {name: AGE_45_54, min_age: 45, max_age: 54}
  - {name: AGE_55_PLUS, min_age: 55, max_age: 99}
invalid_age_bucket: AGE_INVALID   # age < 18 or age > 99
unknown_age_bucket: AGE_UNKNOWN   # age missing

# Precomputed embeddings (proposal §2.1). Both are already L2-normalized.
embeddings:
  image_dim: 512          # CLIP ViT-B/32
  text_dim: 384           # all-MiniLM-L6-v2
  norm_tolerance: 1.0e-3  # every present vector must have L2 norm in [1 - tol, 1 + tol]

# Rows per Parquet row group in transactions.parquet. The file is sorted by
# t_dat_day, so each row group covers a narrow date range and date filters can
# skip row groups using the min/max statistics (~32 row groups in total).
transactions_row_group_size: 1000000
