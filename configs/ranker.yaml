# Ranker (LightGBM LambdaMART) settings, proposal §9. Read by hmrec.config.load_ranker_config.
#
# The three TUNED values (num_leaves, min_data_in_leaf, negatives_per_positive) are chosen
# on V1-V4 with the grid of configs/hpo/v_phase.yaml; `tuned_defaults` are their defaults.
# Everything else is FIXED: it is not in any grid and must not change once V-phase results
# exist. num_threads comes from configs/base.yaml.
#
# Parameters marked (default) have the default value of LightGBM 4.7.0. They are written
# out because they change the result, so an upgrade of LightGBM cannot change them silently.

# Rolling training window (proposal §9.2): a model that predicts a week is trained from
# scratch on the 4 weeks right before it.
window_weeks: 4

# Rows kept per query when ranking: Top-12 (MAP@12, Recall@12, NDCG@12).
top_k: 12

# Every model of the grid is trained to num_trees trees and evaluated after every
# checkpoint_every trees (100, 200, ..., 1000). No early stopping (proposal §9.4).
#
# num_trees was 2000 until 2026-11-18. It was lowered to 1000 AFTER the V1 speed test was
# seen, as a decision about the compute budget (docs/decisions.md): MAP@12 on V1 grew by
# +2.5% from 100 to 200 trees and by +1.4% from 200 to 300, each step about 0.6 of the
# one before; at that rate the step from 900 to 1000 trees is about 0.03%, far below the
# 1% "about equal" tolerance. The rule "stop if the winner's k* is the last checkpoint"
# (configs/hpo/v_phase.yaml) stays and catches the case where this guess is wrong.
num_trees: 1000
checkpoint_every: 100

# Queries scored at a time when a fold is evaluated. A part file of the wide table holds
# 10,000 queries (about 3 million rows); scoring it in one piece needed 5.69 GB in the
# speed test. 2,500 queries x ~305 candidates x 71 features x 4 B = 0.22 GB per float32
# matrix. It changes memory only: a row's score does not depend on the rows scored with it.
scoring_query_chunk_size: 2500

# The training-set NDCG@12 is computed and logged every this many trees (training log
# only, proposal §9.3). Not every tree: that would slow training down.
train_metric_every: 100

# Seed of LightGBM (bagging, feature sampling, bin sampling).
seed: 42

sampling:
  # Seed of the negative sampling (proposal §9.1). Every query draws from its own random
  # generator seeded with (seed, query_id), so the sample of a query does not depend on
  # chunking or on other queries.
  seed: 42
  # Negatives per positive written by the sampling step: one file per (fold, ratio). The
  # sample of a smaller ratio is a subset of the sample of a larger one.
  ratios: [40, 60, 80]
  # Rows per Parquet row group of a sample file = rows lgb.Sequence reads at a time:
  # 100k rows x 71 features x 4 B = 28 MB.
  row_group_rows: 100000

tuned_defaults:
  num_leaves: 31
  min_data_in_leaf: 500
  negatives_per_positive: 40

histogram:
  # How LightGBM builds histograms: col_wise or row_wise. The two can give different
  # trees (the same sums in another order), so the mode is decided ONCE, by the speed
  # test, before any grid trial, and M8 uses the same mode. `undecided` = not decided
  # yet: grid trials refuse to run.
  #
  # DECIDED by the speed test of 2026-11-18 (HEAD 25cacf2, results/m7_speed_test.csv), with
  # the rule below: col_wise 0.682 s/tree, row_wise 0.368 s/tree = 46% faster (>= 15%), and
  # the row_wise process peaked at 1.99 GB (<= 8 GB).
  mode: row_wise
  # THE RULE, written before the speed test (docs/decisions.md 2026-11-18). The speed test
  # trains comparison_trees trees with each mode on the same Dataset, in two processes,
  # WITHOUT any evaluation (no label of a V fold is read, no score is seen). seconds per
  # tree = mean over the trees after the first warmup_trees. row_wise is chosen only if
  #   (col_wise seconds - row_wise seconds) / col_wise seconds >= min_row_wise_speedup
  # AND the row_wise process stayed within memory.limit_gb (configs/base.yaml).
  # Otherwise col_wise (it needs less memory).
  comparison_trees: 50
  warmup_trees: 10
  min_row_wise_speedup: 0.15

# The speed test, run ONCE before the grid (docs/decisions.md 2026-11-18): the default
# configuration is trained to num_trees trees on the 4 weeks before target_fold and
# evaluated after every checkpoint, next to the RRF baseline of the same fold. Its rows go
# to results/m7_speed_test*.csv, never to results/v_phase*.csv.
speed_test:
  target_fold: V1
  num_trees: 300

# Fixed when a binary Dataset is built: they define the bins.
dataset_params:
  max_bin: 255                      # proposal §9.3
  min_data_in_bin: 3                # (default)
  bin_construct_sample_cnt: 200000  # (default) rows sampled to find the bin boundaries
  use_missing: true                 # (default) NaN is "missing", handled by LightGBM (§8.1)
  zero_as_missing: false            # (default)
  enable_bundle: true               # (default)
  # NOT the default (true). With true, LightGBM drops features that cannot be split under
  # the min_data_in_leaf given at build time, so a binary could not be reused for another
  # min_data_in_leaf. One binary per (window, ratio) serves every trial.
  feature_pre_filter: false

train_params:
  objective: lambdarank             # proposal §9.3
  boosting: gbdt                    # (default)
  learning_rate: 0.05               # proposal §9.3
  feature_fraction: 0.8             # proposal §9.3
  bagging_fraction: 0.8             # proposal §9.3
  bagging_freq: 1                   # proposal §9.3
  bagging_by_query: false           # (default) bagging samples rows, not whole queries
  feature_fraction_bynode: 1.0      # (default)
  max_depth: -1                     # (default) no depth limit; num_leaves limits the tree
  min_sum_hessian_in_leaf: 0.001    # (default)
  min_gain_to_split: 0.0            # (default)
  lambda_l1: 0.0                    # (default)
  lambda_l2: 0.0                    # (default)
  # (default) Not tuned in the first grid. A candidate for later, see docs/decisions.md.
  lambdarank_truncation_level: 30
  lambdarank_norm: true             # (default)
  # label_gain is left at its default: labels are 0 / 1 and the gain of label 1 is 1.
  # Categorical features (the 8 int16 codes; code 0 = missing is an ordinary category).
  max_cat_threshold: 32             # (default)
  cat_l2: 10.0                      # (default)
  cat_smooth: 10.0                  # (default)
  max_cat_to_onehot: 4              # (default)
  min_data_per_group: 100           # (default)
  metric: ndcg                      # training log only (proposal §9.3)
  eval_at: [12]                     # training log only (proposal §9.3)
  deterministic: true
  verbosity: -1
