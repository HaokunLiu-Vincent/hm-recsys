# LOCKED recall configuration of R1-R5 (M5, proposal §11). R6 is in twotower.lock.yaml.
#
# DO NOT EDIT OR DELETE (AGENTS.md §3.3): files under configs/locks/ are append-only.
# From M6 on, every F / V / T fold builds its channels from this file through
# hmrec.recall.locked (the only entry). configs/recall/*.yaml (the D-phase
# defaults) and results/d_phase.csv are no longer read for configuration.
#
# Per channel:
#   selection_basis          how this configuration was chosen:
#                              rule_selection   the §4.2 rule on D1-D4 (results/d_phase.csv)
#                              rule_execution   outcome of a pre-registered rule applied
#                                               on top of the rule's selection
#                              manual_decision  chosen by hand (see twotower.lock.yaml)
#   trial_id                 id of the locked configuration (hmrec.hpo.runner.make_trial_id)
#   rule_selected_trial_id   the trial the §4.2 rule selected in the D phase
#                            (= trial_id when selection_basis is rule_selection)
#   decision_record          the docs/decisions.md entry
#   quota                    max candidates per query (must equal config.quota)
#   d_phase_record           FOR THE RECORD ONLY: the selection metric of this trial on
#                            D1-D4 as stored in `source` (pooled = all queries of the
#                            4 weeks averaged, proposal §4.1). D scores are optimistic
#                            (the configurations were chosen on these weeks, §12) and
#                            nothing reads them to make a choice.
#   config                   the COMPLETE channel configuration, same keys as
#                            configs/recall/{channel}.yaml
#
# Not locked here, on purpose:
#   - chunk sizes and threads (configs/base.yaml): they change memory and speed, not results;
#   - the active pool A(a) (configs/catalog.yaml) and the age buckets
#     (configs/preprocess.yaml): frozen in M0 and never tuned.
#
# tests/unit/test_locks_match_records.py checks this file against a replay of the
# selection on results/d_phase.csv plus the R3 rule outcome (results/m4_trials.csv).

lock:
  name: channels
  locked_on: 2026-11-17
  # HEAD when this file was written (the commit that adds this file is its child).
  git_commit: db801c676bb1799f5886e8a6a2b1ec3cb3f9a60c

channels:
  r1_popularity:
