# R3 sibling (same product_code, other colour), proposal §5 R3 (formula S2).
# Read by hmrec.config.load_sibling_config. Not limited to the active pool (proposal §2.4).
#   P(u, c) = sum of exp(-age_days / tau) over u's purchase lines of product_code c in the style window
#   M(j)    = site-wide purchase lines of article j in the market window
#   S(u, j) = P(u, c(j)) * (1 + M(j)) ** gamma
# Candidates exclude articles the customer bought in the style window.

style_lookback_days: 180   # window for P(u, c) and for the exclusion: [anchor - 180d, anchor)
market_window_days: 7      # window for M(j): [anchor - 7d, anchor)
tau_days: 30.0             # HPO (on the best gamma): {14, 30, 60}
gamma: 0.5                 # ablation: {0, 0.5, 1.0}; 0 = style preference only
quota: 50                  # at most 50, never padded
