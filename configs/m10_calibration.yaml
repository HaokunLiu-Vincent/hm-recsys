# M10 calibration: week V4 in a Linux container, compared with the stage-1 records
# (docs/mlops.md §8.3, docs/m10_calibration_plan.md). Read by
# hmrec.config.load_calibration_config; used only by hmrec.calibration and
# scripts/m10_calibrate.py.
#
# NOTHING here changes a result of the system. The recall and Ranker configurations
# come only from configs/locks/. This file says which week is measured, which files
# the measurement must read, and what a difference is compared with.

# The week whose candidates, ranking and metrics are compared.
fold: V4
# The week of the R6 fine-tuning step (item C2): the recorded model after V2 is
# fine-tuned on this week, and the result predicts `fold`.
fine_tune_fold: V3
# Names of the container runs. A later run repeats items in fresh containers, to see
# whether two container runs give the same bits.
runs: [run1, run2, run3, run4]
# run1 and run2 are the two runs of part 2 (2026-11-22). run3 and run4 repeat item C2
# with the Linux-only runtime of the R6 fine-tune (part 3; deterministic algorithms),
# and run3 holds the end-to-end item E.
# The stage-1 Ranker record the container model is compared with: the M8 rehearsal
# trained the locked configuration on V4 to exactly 500 trees and was bit-identical
# to the M7 record (results/m8_rehearsal_check.csv).
ranker_reference_area: m8_rehearsal
# Item E (end to end): the features of `fold` are built from the container's own
# candidates. R6 and its vectors come from the run item E is started for (--run);
# R1-R5, R1's bucket scores and R5's vectors come from `statistical_run`; the Ranker
# model is the one item D trained in `ranker_model_run`.
end_to_end:
  statistical_run: run1
  ranker_model_run: run1
# The Ranker metrics that are compared, in the column order of the stage-1 metric
# tables (results/m8_rehearsal_metrics.csv). The first one is the main metric.
metrics: [map@12, recall@12, ndcg@12]

# sha256 of every input, checked inside the container BEFORE an item reads it; a
# mismatch stops the item. Paths are relative to data/processed/ and to artifacts/.
# The sample hashes are the ones the passed M8 rehearsal trained on
# (results/m8_rehearsal_check.csv); the others were computed on the laptop on
# 2026-11-21 (docs/m10_calibration_plan.md §3) and 2026-11-22 (queries/V3).
# R6 model files are not listed: the chain code checks them against
