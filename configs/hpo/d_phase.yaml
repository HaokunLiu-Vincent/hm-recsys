# D-phase experiments of R1-R5 (proposal §5), read by hmrec.hpo.grid.load_phase_grid.
# Written strictly from the tables in proposal §5; do not add configurations.
# The ORDER of the candidates is part of the selection rule (proposal §4.2,
# docs/decisions.md 2026-11-17) and is committed before any run. DO NOT reorder after a run.
#
# Each channel starts from its configs/recall/*.yaml (the default) and runs its
# steps in order (proposal §4.3: ablation first, then one parameter at a time).
# The winner of a step is the default of the next step.
#
# Step fields:
#   kind:       select            -> the §4.2 multi-candidate rule (hpo/selection.py)
#               convergence_check -> R5 iterations only (proposal §4.2 point 5, §5 R5)
#   order:      listed            -> candidates in priority order as written
#                                    (simpler / cheaper / closer to the default first)
#               nearest_to_current-> one numeric parameter; priority = distance to the
#                                    CURRENT default, ties -> smaller value first
#   candidates: overrides applied to the current default. A candidate equal to the
#               current default is the default itself (not a new trial).
#   requires:   the step runs only if the current config has one of these values;
#               e.g. tau is meaningless for G0 (no decay).
#   stop_at_boundary: (one numeric parameter only) if the selected value is the smallest
#               or largest value of the step, the channel stops after this step and a
#               human decides whether to widen the range; the grid is never extended
#               automatically (R4, R5; docs/decisions.md 2026-11-17).
#               Known limits: it fires only when the step SWITCHES to an edge value
#               (a default kept at an edge does not trigger it), and it cannot be set
#               on multi-parameter steps such as R4 seed_window_x_decay. Those cases
#               are checked by hand (docs/decisions.md 2026-11-17, after the R4 run).

report:
  # Diagnostics only, never used for selection (proposal §4.1): query-weighted
  # score of each group of folds, next to the 4-week score.
  fold_groups:
    D1_D2: [D1, D2]
    D3_D4: [D3, D4]
  # Reported next to the selection metric (proposal §4.1), pooled over the 4 folds.
  extra_metrics: [recall@12, recall@20, ndcg@12, ndcg@20, map@12]

channels:
  r1_popularity:                 # proposal §5 R1: 2 + 6 = 8 configurations
    - name: variant
      kind: select
      order: listed
      candidates:
        - {variant: G0}          # simpler: global raw 7-day count
        - {variant: A1}          # default
    - name: tau_days
      kind: select
      order: nearest_to_current
      requires: {variant: [A1]}
      candidates:
        - {tau_days: 1.0}
        - {tau_days: 2.0}
        - {tau_days: 3.0}
        - {tau_days: 4.0}
        - {tau_days: 5.0}
        - {tau_days: 6.0}
        - {tau_days: 7.0}

  r2_repurchase:                 # proposal §5 R2: 2 + 2 + 1 = 5 configurations
    - name: variant
      kind: select
      order: listed
      candidates:
        - {variant: recency_only}       # simpler
        - {variant: decayed_frequency}  # default
    - name: tau_days
      kind: select
      order: nearest_to_current
      requires: {variant: [decayed_frequency]}
      candidates:
        - {tau_days: 14.0}
        - {tau_days: 30.0}
        - {tau_days: 60.0}
    - name: lookback_days        # added after the R1-R3 D-phase run (docs/decisions.md 2026-11-17)
      kind: select
      order: listed
      candidates:
        - {lookback_days: 180}   # default; shorter = simpler
        - {lookback_days: 365}

  r3_sibling:                    # proposal §5 R3: 5 + 2 = 7 configurations
    - name: gamma                # ablation: gamma = 0 means style preference only
      kind: select               # 1.5 and 2.0 added after the R1-R3 D-phase run (decisions.md)
      order: nearest_to_current
      candidates:
        - {gamma: 0.0}
        - {gamma: 0.5}
        - {gamma: 1.0}
        - {gamma: 1.5}
        - {gamma: 2.0}
    - name: tau_days
      kind: select
      order: nearest_to_current
      candidates:
        - {tau_days: 14.0}
        - {tau_days: 30.0}
        - {tau_days: 60.0}

  r4_itemcf:                     # proposal §5 R4: 2 + 2 + 5 = 9 configurations
    - name: variant
      kind: select
      order: listed
      candidates:
        - {variant: CF0, alpha: 0.5}    # simpler: no IUF, plain cosine
        - {variant: CF3, alpha: 0.7}    # default
    - name: alpha
      kind: select
      order: nearest_to_current
      stop_at_boundary: true
      candidates:
        - {alpha: 0.5}
        - {alpha: 0.7}
        - {alpha: 0.9}
    - name: seed_window_x_decay  # 3 x 2 grid; (90, off) is the default
      kind: select
      order: listed
      candidates:
        - {seed_window_days: 90, seed_decay: false}
        - {seed_window_days: 90, seed_decay: true}
        - {seed_window_days: 180, seed_decay: false}
        - {seed_window_days: 180, seed_decay: true}
        - {seed_window_days: 365, seed_decay: false}
        - {seed_window_days: 365, seed_decay: true}

  r5_wals:                       # proposal §5 R5: 2 + 4 + 2 + 1 + 2 = 11 configurations
    - name: variant
      kind: select
      order: listed
      candidates:
        - {variant: W0}          # simpler: r_ui = 1
        - {variant: W2}          # default
    - name: alpha_conf
      kind: select
      order: nearest_to_current
      # Widened once, AFTER seeing the D results (40 won at the old edge {10, 20, 40}):
      # 60 and 80 added. Widened at most once, so 80 is accepted even if it wins
      # (docs/decisions.md 2026-11-17, R5 alpha_conf).
      stop_at_boundary: false
      candidates:
        - {alpha_conf: 10.0}
        - {alpha_conf: 20.0}
        - {alpha_conf: 40.0}
        - {alpha_conf: 60.0}
        - {alpha_conf: 80.0}
    - name: regularization
      kind: select
      order: nearest_to_current
      stop_at_boundary: true
      candidates:
        - {regularization: 0.01}
        - {regularization: 0.1}
        - {regularization: 1.0}
    - name: factors
      kind: select
      order: listed
      # Not a boundary stop: if 128 passes it is accepted; 256 is never tried, because
      # it would double memory and scoring time again (docs/decisions.md 2026-11-17).
      stop_at_boundary: false
      candidates:
        - {factors: 64}          # cheaper
        - {factors: 128}
    - name: iterations           # only checks that 15 is on the plateau (proposal §5 R5)
      kind: convergence_check
      order: listed
      candidates:
        - {iterations: 10}
        - {iterations: 15}
        - {iterations: 25}

  r6_twotower:                   # proposal §5 R6 / §6.3: E_base, 1 + 5 = 6 configurations
    # Each candidate is a checkpoint of the ONE base training run, predicting
    # D1-D4 with no update. Default epoch 1; fewer epochs = cheaper, so the
    # listed order 2 < 3 < ... < 6 is the priority (docs/decisions.md 2026-11-17).
    # Selecting epoch 6 (the last checkpoint) stops for a human decision.
    - name: base_epoch
      kind: select
      order: listed
      stop_at_boundary: true
      candidates:
        - {base_epoch: 1}
        - {base_epoch: 2}
        - {base_epoch: 3}
        - {base_epoch: 4}
        - {base_epoch: 5}
        - {base_epoch: 6}
    # Weekly training chain (proposal §6.4), from the E_base winner. The default is
    # "frozen" (e_update 0: the base checkpoint predicts D1-D4 with no update; its
    # trial is the E_base winner, reused). Every configuration scores D1 with the
    # same base model, so "better on >= 3 of 4 weeks" in effect needs D2, D3 and D4
    # all better. Priority: fewer epochs and no replay first (cheaper / simpler).
    # Decided after seeing the E_base results, before any chain run
    # (docs/decisions.md 2026-11-17).
    - name: update
      kind: select
      order: listed
      candidates:
        - {e_update: 1, replay: 0.0}
        - {e_update: 1, replay: 0.5}
        - {e_update: 2, replay: 0.0}
        - {e_update: 2, replay: 0.5}

# Extra seeds, reported only (never used to select): the top 2 configurations of
# a step by the §4.2 rule each run again with these seeds (hmrec.hpo.robustness).
robustness:
  r6_twotower:
    step: update
    top_k: 2
    seed_key: chain_seed     # changes only the fine-tune shuffles and the replay draws
    seeds: [43, 44]
